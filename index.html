<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Third-party preconnect (dns-prefetch as fallback):
         webcnstatic.yostar.net - Loading avatars/background/fonts
         api.injahow.cn - music API
         at.alicdn.com - Iconfont script -->
    <link rel="preconnect" href="https://webcnstatic.yostar.net" />
    <link rel="dns-prefetch" href="https://webcnstatic.yostar.net" />
    <link rel="preconnect" href="https://api.injahow.cn" />
    <link rel="dns-prefetch" href="https://api.injahow.cn" />
    <link rel="preconnect" href="https://at.alicdn.com" />
    <link rel="dns-prefetch" href="https://at.alicdn.com" />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="/" name="msapplication-starturl" />
    <link rel="bookmark" href="<%- favicon %>" />
    <link rel="apple-touch-icon-precomposed" href="<%- favicon %>" />
    <meta name="description" content="<%- description %>" />
    <meta name="keywords" content="<%- keywords %>" />
    <meta name="author" content="<%- author %>" />
    <!-- Open Graph / social share card -->
    <meta property="og:title" content="<%- title %>" />
    <meta property="og:description" content="<%- description %>" />
    <meta property="og:type" content="website" />
    <!-- og:image must be an absolute URL for crawlers (relative paths break share previews) -->
    <meta property="og:image" content="<%- siteUrl %>/favicon512.png" />
    <% if (siteUrl) { %>
    <meta property="og:url" content="<%- siteUrl %>/" />
    <link rel="canonical" href="<%- siteUrl %>/" />
    <% } %>
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="<%- title %>" />
    <meta name="twitter:description" content="<%- description %>" />
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="<%- themeColor %>" name="theme-color" />
    <link id="favicon" href="<%- favicon %>" rel="icon" />
    <title><%- title %></title>
  </head>
  <body>
    <div id="app"></div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
