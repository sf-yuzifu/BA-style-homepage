<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 第三方域名连接预热（preconnect + dns-prefetch 兜底）：
         webcnstatic.yostar.net - Loading 首屏头像/背景/TTF 字体
         api.injahow.cn - 音乐 API
         at.alicdn.com - Iconfont 脚本 -->
    <link rel="preconnect" href="https://webcnstatic.yostar.net" />
    <link rel="dns-prefetch" href="https://webcnstatic.yostar.net" />
    <link rel="preconnect" href="https://api.injahow.cn" />
    <link rel="dns-prefetch" href="https://api.injahow.cn" />
    <link rel="preconnect" href="https://at.alicdn.com" />
    <link rel="dns-prefetch" href="https://at.alicdn.com" />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="/" name="msapplication-starturl" />
    <link rel="bookmark" href="<%- favicon %>" />
    <link rel="apple-touch-icon-precomposed" href="<%- favicon %>" />
    <meta name="description" content="<%- description %>" />
    <meta name="keywords" content="<%- keywords %>" />
    <meta name="author" content="<%- author %>" />
    <!-- Open Graph / 社交分享卡片 -->
    <meta property="og:title" content="<%- title %>" />
    <meta property="og:description" content="<%- description %>" />
    <meta property="og:type" content="website" />
    <!-- 爬虫要求 og:image 为绝�?URL（相对路径会导致分享卡片无图�?-->
    <meta property="og:image" content="<%- siteUrl %>/favicon512.png" />
    <% if (siteUrl) { %>
    <meta property="og:url" content="<%- siteUrl %>/" />
    <link rel="canonical" href="<%- siteUrl %>/" />
    <% } %>
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="<%- title %>" />
    <meta name="twitter:description" content="<%- description %>" />
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="<%- themeColor %>" name="theme-color" />
    <link id="favicon" href="<%- favicon %>" rel="icon" />
    <title><%- title %></title>
  </head>
  <body>
    <div id="app"></div>
    <script src="/src/main.ts" type="module"></script>
  </body>
</html>
