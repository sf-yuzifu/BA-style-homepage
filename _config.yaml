# 基础配置文件（所有语言通用）
# Website Basic Configuration

# 网站标题 - 浏览器标签页显示的标题
title: Tori Archive

# 网站描述 - 用于搜索引擎优化和社交媒体分享
description: Toriの个人主页

# 网站图标路径 - 浏览器标签页显示的小图标
favicon: /favicon144.png

# 网站作者姓名
author: Tori

# 网站关键词 - 用于搜索引擎优化，逗号分隔
keywords: 'Blue Archive, Tori, Personal Homepage, Tom6814'

# ICP备案号 - 中国网站备案信息，留空表示未备案
ICP: ''

# PWA配置 - 渐进式Web应用配置
manifest:
  # PWA应用完整名称
  name: Tori Archive

  # PWA应用简短名称 - 用于桌面显示
  short_name: Tori's Archive

  # PWA应用描述
  description: Toriの个人主页~

  # PWA主题颜色 - 影响浏览器UI颜色
  theme_color: '#128AFA'

  # PWA启动URL - 应用启动时打开的页面
  start_url: /

  # PWA应用唯一标识符
  id: Homepage

  # PWA图标配置
  icons:
    # 大尺寸图标 - 用于桌面安装
    - src: /favicon512.png
      sizes: 512x512
      purpose: any maskable

    # 小尺寸图标 - 用于移动设备
    - src: /favicon144.png
      sizes: 144x144

# 个人游戏等级信息
level: 99 # 当前等级
exp: 8964 # 当前经验值
nextExp: 8381 # 升级所需经验值

# Iconfont字体库地址 - 阿里云图标字体库
iconfont: 'https://at.alicdn.com/t/c/font_4336463_r5p9u2rf30h.js'

# 底部项目展示区域 - 显示相关项目链接
dock:
  # 项目1
  - name: Project PureLove
    href: 'https://github.com/Tom6814/Project-PureLove'
    imgSrc: /img/bandcomic.png

  # 项目2
  - name: Tori Music
    href: 'https://music.2z2.org'
    imgSrc: /img/fish.png


  # 项目3
  - name: JMComic3 No-Ads
    href: 'https://github.com/Tom6814/JMComic3-NO-Ads'
    imgSrc: /img/convertor.png

  # 项目4
  - name: JM-Aura
    href: 'https://web.jmcomic.uk/'
    imgSrc: /img/waddle2.png

  # 项目5
  - name: AI Comic Detector For JM
    href: 'https://github.com/Tom6814/AI-Benzi-Detect-JMComic'
    imgSrc: /img/boxy.png

# 左侧联系方式区域
contact:
  # 联系方式1
  - name: Github
    href: 'https://github.com/Tom6814'
    iconfont: icon-github

  # 联系方式2
  - name: bilibili
    href: 'https://space.bilibili.com/3537113777703733'
    iconfont: icon-bilibili

  # 联系方式3
  - name: YouTube
    href: 'https://www.youtube.com/@Sliverwhale'
    iconfont: icon-youtube

  # 联系方式4
  - name: Mail
    href: 'mailto:me@nya.sarl'
    iconfont: icon-email

# 任务按钮配置 - 页面左下角的任务按钮
task:
  # 任务按钮显示文本
  name: Blog Link
  # 任务按钮链接地址
  href: 'https://blog.2z2.org/"

