# =============================================================================
# 站点配置示例 — Fork 后复制为 _config.yaml 再按需修改
# Example site config — copy to _config.yaml and customize
# =============================================================================
#
# 构建时会校验 _config.yaml 字段与 public/ 资源是否存在；本文件不参与构建。
# 多语言文案在 src/locales/*.yaml 覆盖；个人简介正文在 bio/{locale}.md
#
# 语音（可选）：各角色 path 下 ja-JP/、zh-CN/ 目录，文件名为 spine talk 事件 key + .mp3

# --- 站点基本信息 / Site meta ---

title: My Homepage
description: A personal homepage in Blue Archive style.
favicon: /favicon144.png
author: Your Name
keywords: 'Blue Archive, Personal Homepage'

# 社交分享绝对 URL 前缀；留空则 og:url/canonical 不输出
url: 'https://example.com'

# 社交分享卡片（OG 图）源图，路径相对仓库根目录
# 构建时用 sharp 裁切为 1200×630 的 /og-home.jpg 与 /og-bio.jpg（bio/ 路由的独立卡片）
# 缺省用 shots/zh/pic1.png / pic2.png 两张存档截图；fork 后建议替换为自己的截图，勿直接删除
og:
  home: shots/zh/pic1.png
  bio: shots/zh/pic2.png

ICP: ''
gongan: ''

manifest:
  name: My Homepage
  short_name: Homepage
  description: A personal homepage in Blue Archive style.
  theme_color: '#128AFA'
  start_url: /
  id: Homepage
  # 显示模式 / Display mode：fullscreen | standalone | minimal-ui | browser
  # 缺省 standalone（安装后独立窗口打开）；未填时构建自动补上
  display: standalone
  # 安装对话框截图 / Install dialog screenshots（可选）
  # 缺省由构建自动生成 1280×720 JPEG（/screenshot-home.jpg、/screenshot-bio.jpg，
  # 与 OG 图同源）；自定义时把图片放 public/ 并在此登记，构建会校验文件存在
  # screenshots:
  #   - src: /screenshot-home.jpg
  #     sizes: 1280x720
  #     type: image/jpeg
  #     form_factor: wide
  icons:
    - src: /favicon512.png
      sizes: 512x512
      purpose: any maskable
    - src: /favicon144.png
      sizes: 144x144

# --- 大厅数值（首次访问后部分由 localStorage 接管）/ Lobby stats ---

level: 1
exp: 0
nextExp: 100
gold: 0
pyroxene: 0

# 图标字体 JS；默认仓库内置 public/js/iconfont.js
iconfont: /js/iconfont.js

# --- 底部项目 / Footer dock（推荐 ≤5）---

dock:
  - name: My Project
    href: 'https://github.com/you/repo'
    imgSrc: /img/fish.png

# --- 左侧联系 / Contact grid（推荐 4）---

contact:
  - name: GitHub
    href: 'https://github.com/you'
    iconfont: icon-github

# --- 左下角任务按钮 / Task button ---

task:
  name: Blog
  href: 'https://example.com/blog'

# --- 音乐 Banner / Music player ---
#
# 支持多音源，全部合并进同一随机池；不配置的源直接省略。
# 旧字段 banner.musicID（网易云单曲 ID 列表）仍有效，自动并入 music.netease。
#
# 各源限制：
#   netease / neteasePlaylist — 经 api.injahow.cn 公共 Meting 实例，VIP 曲多数可播
#   tencent / kugou           — 浏览器侧 JSONP 直连官方接口，仅免费曲可播，VIP 自动跳过
#   kuwo                      — 同上；歌名/歌手/封面自动获取
#   local                     — 直链/自托管（放 public/ 下），name/artist 必填

banner:
  music:
    # 网易云单曲 ID（分享链接 /song?id=xxxx 末尾数字）
    netease:
      - 2059151619
    # 网易云歌单 ID（/playlist?id=xxxx），启动时一次展开为单曲
    neteasePlaylist:
      - 2619366284
    # QQ 音乐 songmid（歌曲页地址 /songmid/xxxx）
    tencent:
      - '0042rlGx2WHBrG'
    # 酷狗 hash（32 位十六进制，可在酷狗网页版歌曲页/分享参数中找到）
    kugou:
      - 48C685F679FFC7CF08B8A8341CA9DB44
    # 酷我 rid（纯数字，歌曲页 /play/xxxx 末尾数字；也可写对象形式覆盖元数据：
    #   - id: 3262923
    #     name: 雪月花
    #     artist: →Pia-no-jaC←）
    kuwo:
      - 3262923
    # 直链/自托管音频
    local:
      - url: /music/demo.mp3
        name: Demo
        artist: Me
        cover: /img/cover.png

# --- 回忆大厅 Live2D / Memorial lobbies ---
#
# 必填：name, path, skel, atlas, offset（0–1 水平位置）
#
# 可选 interactions（缺省则按骨骼名自动探测，一般无需写）：
#   interactions:
#     gaze: { bone: Touch_Eye, smoothTime: 0.15, minX: -48.1, maxX: 79.0, minY: -57.2, maxY: 98.3 }
#     pat: { bone: Touch_Point, smoothTime: 0.1, minX: -9.6, maxX: 13.5, minY: -33.9, maxY: 32.6 }
#     dragBones:
#       - { bone: breast_01L, radius: 120, range: 30, smoothTime: 0.08 }
#     设为 false 可禁用对应互动：gaze: false / pat: false / dragBones: false
#
# 台词气泡默认自动跟随嘴/脸骨骼；可选 dialogueDisplay：
#   mode: auto | manual（manual 时用 x/y/position 手动定位）
#   bone, offsetX, offsetY, side: auto | left | right

memorialLobbies:
  - name: Example
    path: '/l2d/aris_battle/'
    skel: 'CH0334_home.skel'
    atlas: 'CH0334_home.atlas'
    offset: 0.5

# --- 个人简介页 / Bio page ---

bio:
  student:
    - name: CH0334_spr
      path: '/l2d/CH0334_spr/'
      skel: 'CH0334_spr.skel'
      atlas: 'CH0334_spr.atlas'
  btn:
    - name: Game A
      path: /img/card/ba.png
