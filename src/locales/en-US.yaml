# Aris (Battle) voice dialogue
memorialLobbies[0]:
  voice:
    CH0334_MemorialLobby_1_1: Hehe. Sensei, were you surprised?
    CH0334_MemorialLobby_1_2: I wanted to enjoy this night sky with you, Sensei... so I called you here.
    CH0334_MemorialLobby_2_1: It really is... absolutely beautiful.
    CH0334_MemorialLobby_2_2: Whether it's Aris's world, or worlds I haven't visited yet... I'm sure there are many more wonderful things like this.
    CH0334_MemorialLobby_3_1: But, it's so strange.
    CH0334_MemorialLobby_3_2: The world is this beautiful, yet why do people still fight each other?
    CH0334_MemorialLobby_4: Just like that starry sky, the beauty of this world is surely enough to share with everyone...
    CH0334_MemorialLobby_5: ...As expected, Aris still doesn't understand.

# Kei Voice Dialogue
memorialLobbies[1]:
  voice:
    CH0335_MemorialLobby_1_1: Don't worry.
    CH0335_MemorialLobby_1_2: I will not disappear.
    CH0335_MemorialLobby_2_1: Quite the opposite.
    CH0335_MemorialLobby_2_2: No matter what means I must use, I will survive.
    CH0335_MemorialLobby_3_1: As long as you do not abandon this world, Sensei.
    CH0335_MemorialLobby_3_2: Then I will not give up until the very end.
    CH0335_MemorialLobby_4_1: So rest assured... absolutely, everything will be fine.
    CH0335_MemorialLobby_4_2: I will always be here.
    CH0335_MemorialLobby_5_1: I will only say this here... I—
    CH0335_MemorialLobby_5_2: Do not hate you, Sensei.

# Hina (Swimsuit) voice dialogue
memorialLobbies[2]:
  voice:
    CH0063_MemorialLobby_1_1: Honestly, I've never understood people's fascination with the ocean.
    CH0063_MemorialLobby_1_2: While everyone's having a good time, I've never felt the same way.
    CH0063_MemorialLobby_2_1: It's blurry underwater, and I get nervous when my feet can't touch the ground.
    CH0063_MemorialLobby_2_2: Sensei, have you ever felt that way before?
    CH0063_MemorialLobby_3_1: I find it eerie... The way the sea is just a bottomless well at night.
    CH0063_MemorialLobby_3_2: I hate how it feels like I'll be sucked in just looking at it.
    CH0063_MemorialLobby_4_1: But, you know, I think I'm beginning to understand. At least a little bit.
    CH0063_MemorialLobby_4_2: The ocean can be so beautiful.
    CH0063_MemorialLobby_5_1: It's a new feeling but it's interesting too.
    CH0063_MemorialLobby_5_2: Thank you, Sensei...for being here with me. And for everything you've taught me.

